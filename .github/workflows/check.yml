name: Rust and React checks
on: [push, pull_request]
jobs:
  application:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile build.py run.py
      - run: cargo fmt --manifest-path ai-backend/Cargo.toml --check
      - run: cargo clippy --manifest-path ai-backend/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path ai-backend/Cargo.toml --locked
      - run: npm ci --prefix frontend
      - run: npm run format:check --prefix frontend
      - run: npm run build --prefix frontend
      - run: cargo run --manifest-path ai-backend/Cargo.toml --locked -- eval
# MAX needs hardware-specific validation; this workflow makes no inference/VRAM claim.
